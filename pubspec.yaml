name: go_casting
description: "GoCasting — Surf casting equipment & tide tool. Fully offline."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  # GetX — State Management + Navigation + Utils
  get: ^4.7.2

  # Database
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.1

  # Notifications
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0

  # Charts
  fl_chart: ^0.70.2

  # Models
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Image Picker
  image_picker: ^1.1.2

  # Backup & Share
  share_plus: ^10.1.4
  archive: ^4.0.2
  file_picker: ^8.1.6

  # V5: Map & Location
  amap_flutter_map: ^3.0.0
  amap_flutter_base: ^3.0.0
  geolocator: ^13.0.2
  permission_handler: ^11.3.1
  http: ^1.2.2
  url_launcher: ^6.3.1

  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Code Generation
  build_runner: ^2.4.14
  freezed: ^2.5.8
  json_serializable: ^6.9.4
  drift_dev: ^2.22.1

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/db/
    - assets/data/
    - assets/images/
